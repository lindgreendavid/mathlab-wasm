[package]
name = "mathlab-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "An inspectable Rust/WebAssembly laboratory for root-finding convergence and failure modes"
license = "MIT"
repository = "https://github.com/lindgreendavid/mathlab-wasm"
homepage = "https://lindgreendavid.github.io/mathlab-wasm/"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
