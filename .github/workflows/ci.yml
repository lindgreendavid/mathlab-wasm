name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-wasm-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: taiki-e/install-action@8561830551f57056c14ace724f164bcae2d227c2
        with:
          tool: wasm-pack@0.13.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --example generate_report -- /tmp/v0.1-root-finding.json
      - run: cmp reports/v0.1-root-finding.json /tmp/v0.1-root-finding.json
      - run: wasm-pack build --release --target web --out-dir web/pkg
      - run: python3 scripts/verify_report.py
      - run: python3 scripts/verify_web.py
      - run: node --check web/js/app.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
